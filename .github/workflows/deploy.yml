name: Deploy

on:
  workflow_dispatch:
  # release:
  #   types: [created]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: 'qtserialport'
          
      - name: Install dependencies
        run: |
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libglib2.0-0 libdbus-1-3 libfuse2
          
      - name: Create Desktop File
        run: |
          cat > SerialFlow.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=SerialFlow
          Exec=SerialFlow
          Icon=SerialFlow
          Categories=Utility;
          EOF
          cp resources/icon.png SerialFlow.png

      - name: Build AppImage
        run: |
          mkdir build
          cd build
          qmake ../SerialFlow.pro
          make
          cd ..
          # download linuxdeploy and Qt plugin
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          # build appimage
          QMAKE=$(which qmake) ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --executable build/SerialFlow \
            --desktop-file SerialFlow.desktop \
            --icon-file resources/icon.png
          mv SerialFlow*.AppImage SerialFlow.AppImage
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialFlow-Ubuntu-AppImage
          path: SerialFlow.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          modules: 'qtserialport'
          
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\SerialFlow.pro
          nmake
          cd release
          windeployqt SerialFlow.exe
          cd ..
          powershell Compress-Archive -Path release -DestinationPath SerialFlow-Windows.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialFlow-Windows
          path: build/SerialFlow-Windows.zip

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel qt6-base qt6-serialport git

      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          mkdir build
          cd build
          qmake6 ../SerialFlow.pro
          make
          mv SerialFlow SerialFlow-Arch
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialFlow-Arch
          path: build/SerialFlow-Arch

  upload-assets:
    needs: [build-ubuntu, build-windows, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Display structure of downloaded files
        run: ls -R
        
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          overwrite: true
          files: |
            SerialFlow-Ubuntu-AppImage/SerialFlow.AppImage
            SerialFlow-Windows/SerialFlow-Windows.zip
            SerialFlow-Arch/SerialFlow-Arch
